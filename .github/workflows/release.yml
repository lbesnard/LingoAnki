name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(poetry version ${{ github.event.inputs.bump_type }} | awk '{print $NF}')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD
          git push origin "v${{ steps.bump.outputs.new_version }}"

  build-wheel:
    runs-on: ubuntu-latest
    needs: bump

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.new_version }}"

      - name: Clean up directories
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ github.repository }}-3.10.14-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: |
          source .venv/bin/activate
          poetry run coverage run -m pytest
          poetry run coverage report --fail-under=5

      - name: Build wheel
        run: poetry build --format wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingodiary-wheel
          path: dist/*.whl

  build-apk:
    runs-on: ubuntu-latest
    needs: bump
    environment: android_release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.new_version }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      - name: Install Android SDK (act/local only)
        if: ${{ env.ACT }}
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Regenerate Flutter project scaffold
        run: bash scripts/setup_flutter_app.sh

      - name: Sync version from pyproject.toml to pubspec.yaml
        run: |
          # Extract version from pyproject.toml
          # VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])" 2>/dev/null || \
                    grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          # Convert to Flutter version format: major.minor.patch+buildNumber
          # For now, use patch as build number (e.g., 5.0.0 -> 5.0.0+500 where 500 is patch*100 + minor*10 + major)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          # Update pubspec.yaml version
          sed -i "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" android_app/pubspec.yaml
          echo "Updated pubspec.yaml to version: $VERSION+$BUILD_NUMBER"
          cat android_app/pubspec.yaml | grep version

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_FILE" ]; then
            echo "ERROR: Android keystore secrets not configured!"
            exit 1
          fi

          echo "Setting up release signing with keystore..."

          # Decode base64 keystore file to consistent location
          KEYSTORE_PATH="$HOME/release.jks"
          echo "$ANDROID_KEYSTORE_FILE" | base64 -d > "$KEYSTORE_PATH"

          # Verify keystore was created
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Failed to create keystore file!"
            exit 1
          fi

          echo "Keystore file created: $(ls -la $KEYSTORE_PATH)"

          # Test keystore accessibility
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
            echo "ERROR: Cannot access keystore or alias!"
            exit 1
          }
          echo "Keystore and alias verified successfully"

          # Create key.properties file for Flutter (use absolute path)
          cat > android_app/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          echo "Created key.properties file with keystore path: $KEYSTORE_PATH"

          # Verify key.properties was created correctly
          echo "key.properties contents:"
          cat android_app/android/key.properties

      - name: Install Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: android_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: android_app
        run: flutter test

      - name: Build release APK
        working-directory: android_app
        run: |
          echo "Building release APK..."

          # Verify key.properties exists
          if [ ! -f "android/key.properties" ]; then
            echo "ERROR: key.properties file not found!"
            exit 1
          fi

          echo "key.properties found, contents:"
          cat android/key.properties

          # Build the APK
          flutter build apk --release --verbose

          # Verify the APK was created
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found after build!"
            exit 1
          fi

          echo "APK built successfully: $(ls -lh $APK_PATH)"

          # Verify APK signature (if apksigner is available)
          if command -v apksigner >/dev/null 2>&1; then
            echo "Verifying APK signature..."
            apksigner verify --print-certs "$APK_PATH" || {
              echo "WARNING: APK signature verification failed or shows debug signature"
            }
          else
            echo "apksigner not available, skipping signature verification"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingodiary-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk

  build-flutter-web:
    runs-on: ubuntu-latest
    needs: bump

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.new_version }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      - name: Install Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Flutter web
        working-directory: android_app
        run: flutter build web --release

      - name: Zip Flutter web build
        run: |
          cd android_app/build/web
          zip -r ../../../lingodiary-web.zip .

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingodiary-web
          path: lingodiary-web.zip

  release:
    runs-on: ubuntu-latest
    needs: [bump, build-wheel, build-apk, build-flutter-web]

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: lingodiary-wheel
          path: dist/

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lingodiary-apk
          path: apk/

      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: lingodiary-web
          path: web/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.bump.outputs.new_version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.bump.outputs.new_version }}" \
            --generate-notes \
            dist/*.whl \
            apk/app-release.apk \
            web/lingodiary-web.zip

[tool.poetry]
name = "lingodiary"
version = "9.0.0"
description = "Language learning diary with TPRS lesson generation."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
package-mode = true
packages = [{ include = "lingodiary" }]

[tool.poetry.dependencies]
flask-babel = ">=4.0.0"
python = "^3.10"
inquirer = ">=3.1.1"
markdown = ">=3.7"
PyYAML = ">=6.0.2"
platformdirs = ">=4.3.7"
openai = ">=1.72.0"
flask = ">=3.1.0"
deep_translator = { version = ">=1.10.1", extras = [
  'ai',
] } # version supporting ChatGptTranslator
gtts = ">=2.2.4"
bcrypt = "4.3.0"
pydub = ">=0.25.1"
numpy = ">=1.24.0,<2.0.0"
PyJWT = ">=2.8.0"

# Heavy ML packages — installed via pip in the Docker base stage.
# In Docker: poetry install --without ml (they're already in system Python).
# Local dev:  poetry install            (included by default, no flag needed).
[tool.poetry.group.ml.dependencies]
spacy = ">=3.6.1"
# openai-whisper = { git = "https://github.com/openai/whisper", rev = "main" }
openai-whisper = ">=20250625"
piper-tts = ">=1.2.0"
ovos-tts-plugin-piper = "==0.0.2"


[tool.poetry.scripts]
lingoDiary = "lingodiary.diary:main"
lingoWebapp = "lingodiary.webapp:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
poetry = "==2.3.3"                  # SYNC: see .poetry-version for all locations to update
pytest = "^8.2.1"
ipdb = "^0.13"
ipython = "^7.5.3"
coverage = "^7.5.3"
pre-commit = "^3.7.1"
poetry-pre-commit-plugin = ">0.1.2"

[tool.pre_commit]
version = "2.3.0"
config = ".pre-commit-config.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lingodiary"]
omit = ["**/test_*", "lingodiary/migrate_to_json.py"]

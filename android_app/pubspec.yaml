name: lingodiary_app
description: A Flutter client to use with the LingoDiary web server.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.2.0
  go_router: ^17.2.3
  http: ^1.2.0
  # just_audio: plain package only — do NOT add just_audio_background or
  # audio_service without thorough real-device testing. Even a caught
  # init() failure leaves just_audio_background in a partial state that
  # intercepts all AudioPlayer method-channel calls (stop, setAudioSource),
  # silently corrupting audio playback AND text entry display (v1.0 regression).
  just_audio: ^0.10.5
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  wakelock_plus: ^1.2.0
  web: ^1.0.0
  audio_session: ^0.1.16
  flutter_background: ^1.3.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  web: 1.0.0
  go_router: 17.2.3
  flutter_secure_storage: 10.2.0
  wakelock_plus: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Root-level configuration for the icon generator (2 spaces for children)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1E1E2E" # Matches your icon background
    theme_color: "#1E1E2E"

services:
  lingo-diary:
    build: .
    image: lozzaroo/lingodiary
    ports:
      - 8083:8084
    stdin_open: true
    tty: true
    volumes:
      - /opt/lingodiary_venv:/app/.venv
      - ~/.config/efunk_lingo/lingoDiary/:/app/.config/lingoDiary/
      - ~/Documents/lingodiary/:/data/
    environment:
      # Required: generate with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: "4dea2020568dca5f8ad784e3110283fcf82f87c50c12f47b9a56ae95f572b0d2"
      # Paths inside the container (match the volume mounts above)
      CONFIG_ROOT: /app/.config/lingoDiary
      USER_DB_FILE: /app/.config/lingoDiary/users.yaml
      DATA_ROOT: /data
